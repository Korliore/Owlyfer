version: "3"

services:
  bot_owlyfer:
    labels:
      logging: true
    build:
      context: .
      dockerfile: _CI/Dockerfile
    container_name: bot_owlyfer
    networks:
      - owlyfer_lan
    env_file:
      - Owlyfer/.env
    depends_on:
      - postgres_owlyfer
      - mongo_owlyfer

  postgres_owlyfer:
    image: postgres:alpine
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - Owlyfer/.env
    container_name: postgres_owlyfer
    networks:
      - owlyfer_lan
    volumes:
      - owlyfer_data:/var/lib/postgresql/data

  mongo_owlyfer:
    image: mongo:latest
    env_file:
      - Owlyfer/.env
    container_name: mongo_owlyfer
    networks:
      - owlyfer_lan
    volumes:
      - mongo_data:/data/db

networks:
  owlyfer_lan:
    driver: bridge

volumes:
  owlyfer_data:
  mongo_data: