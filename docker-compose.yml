version: "3"

services:
  bot_owlyfer:
    labels:
      logging: true
    build:
      context: .
      dockerfile: _CI/Dockerfile
    container_name: bot_owlyfer
    networks:
      - owlyfer_lan
    depends_on:
      - postgres

  postgres:
    image: postgres:alpine
    container_name: postgres
    networks:
      - owlyfer_lan
    volumes:
      - owlyfer_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  owlyfer_lan:
    driver: bridge

volumes:
  owlyfer_data:
